input:
  source: "input.mp4"  # video path, webcam index "0", or RTSP URL
  resize_width: 1280
ocr:
  languages: ["en"]
  gpu: false
  interval_frames: 3
  min_confidence: 0.18
recognition:
  lock_after_hits: 3
  forget_after_misses: 18
  require_iso_check_digit: false
display:
  show_zoom_inset: true
  show_status: true
output:
  save_video: true
  video_path: "runs/container_annotated.mp4"
  events_csv: "runs/container_events.csv"
  events_json: "runs/container_events.json"
